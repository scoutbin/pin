# Generated by spine v0.0.0-20261113103041-601985abdfa2 from spine.json. Do not edit.
name: Install pin
description: "Installs pin (Audit system behaviour in a lockfile) from a GitHub release, verifies its SHA-256 and adds it to PATH. On Linux and macOS it needs curl, or a wget that supports --https-only (a busybox wget does not), so minimal container images must install one first."
author: "scoutbin"

inputs:
  version:
    description: Release tag to install, like v0.1.1. Takes precedence over track. Default is the newest release on the track.
    required: false
    default: ''
  track:
    description: stable, alpha, beta or rc. Installs the newest release on that track's upgrade path, as install.sh does.
    required: false
    default: stable
  install-dir:
    description: Directory to install into, relative to the workspace if not absolute. Default is $RUNNER_TEMP/pin/bin.
    required: false
    default: ''
  token:
    description: GitHub token for the release lookup, to stay clear of the API rate limit. It is not used for downloads.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The installed release tag.
    value: ${{ steps.unix.outputs.version || steps.windows.outputs.version }}
  path:
    description: Absolute path of the installed pin executable.
    value: ${{ steps.unix.outputs.path || steps.windows.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install pin (Linux and macOS)
      id: unix
      if: runner.os != 'Windows'
      shell: sh
      run: |
        set -eu
        dir=${PIN_INSTALL_DIR:-$RUNNER_TEMP/pin/bin}
        case $dir in
          /*) ;;
          *) dir=$PWD/$dir ;;
        esac
        dir=${dir%/}
        case $dir in
          *[[:cntrl:]]*) echo "::error::install-dir must not contain control characters"; exit 1 ;;
        esac
        # The directory is on PATH for install.sh so it does not warn about it. Later steps get it through GITHUB_PATH.
        PIN_INSTALL_DIR=$dir PATH="$dir:$PATH" sh "$GITHUB_ACTION_PATH/install.sh"
        version=$("$dir/pin" version | awk 'NR == 1 { print $2 }')
        [ -n "$version" ] || { echo "::error::could not read the version from $dir/pin"; exit 1; }
        case $version in
          v[0-9]*) ;;
          *) echo "::error::unexpected version output from $dir/pin"; exit 1 ;;
        esac
        printf '%s\n' "$dir" >> "$GITHUB_PATH"
        printf 'version=%s\npath=%s\n' "$version" "$dir/pin" >> "$GITHUB_OUTPUT"
      env:
        PIN_VERSION: ${{ inputs.version }}
        PIN_TRACK: ${{ inputs.track }}
        PIN_INSTALL_DIR: ${{ inputs.install-dir }}
        PIN_GITHUB_TOKEN: ${{ inputs.token }}
        PIN_NO_MODIFY_PATH: '1'
    - name: Install pin (Windows)
      id: windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $dir = if ($env:PIN_INSTALL_DIR) { $env:PIN_INSTALL_DIR } else { Join-Path $env:RUNNER_TEMP 'pin\bin' }
        if ($dir -match '[\x00-\x1f]') { throw 'install-dir must not contain control characters' }
        if (-not [IO.Path]::IsPathRooted($dir)) { $dir = Join-Path (Get-Location).Path $dir }
        $dir = [IO.Path]::GetFullPath($dir).TrimEnd('\', '/')
        $env:PIN_INSTALL_DIR = $dir
        & "$env:GITHUB_ACTION_PATH\install.ps1"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $version = ((& "$dir\pin.exe" version | Select-Object -First 1) -split ' ')[1]
        if (-not $version) { throw "could not read the version from $dir\pin.exe" }
        if ($version -notmatch '^v[0-9]') { throw "unexpected version output from $dir\pin.exe" }
        # AppendAllText writes no byte order mark, which Windows PowerShell 5.1's Add-Content -Encoding utf8 does.
        [IO.File]::AppendAllText($env:GITHUB_PATH, "$dir`n")
        [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`npath=$dir\pin.exe`n")
      env:
        PIN_VERSION: ${{ inputs.version }}
        PIN_TRACK: ${{ inputs.track }}
        PIN_INSTALL_DIR: ${{ inputs.install-dir }}
        PIN_GITHUB_TOKEN: ${{ inputs.token }}
        PIN_NO_MODIFY_PATH: '1'
